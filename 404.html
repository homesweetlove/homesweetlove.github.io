<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · homesweetlove.dev</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --text: #14152b; --dim: #5b5d78; --faint: #9294ad;
    --line: rgba(20, 21, 43, .1);
    --accent: #6c5ce7; --accent-2: #00c2d1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c14; --text: #f2f2f8; --dim: #a6a8c2; --faint: #6c6e8a; --line: rgba(255,255,255,.1); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: grid; place-items: center; padding: 24px; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -20%; pointer-events: none; z-index: -1;
    background:
      radial-gradient(circle at 20% 25%, rgba(108,92,231,.18), transparent 35%),
      radial-gradient(circle at 80% 75%, rgba(0,194,209,.14), transparent 35%);
  }
  main { text-align: center; max-width: 560px; }
  .code {
    font: 700 clamp(6rem, 26vw, 11rem)/1 'JetBrains Mono', monospace;
    letter-spacing: -.06em; margin: 0; position: relative; display: inline-block;
    color: var(--text);
    /* stencil cut, matches the favicon */
    -webkit-mask: linear-gradient(#000 0 46%, transparent 46% 53%, #000 53% 100%);
            mask: linear-gradient(#000 0 46%, transparent 46% 53%, #000 53% 100%);
    text-shadow: 0 0 22px rgba(255,255,255,.25);
  }
  .spray { position: absolute; border-radius: 50%; background: var(--text); opacity: .55; }
  .tag {
    margin: 12px 0 6px; font: 500 .8rem 'JetBrains Mono', monospace;
    letter-spacing: .14em; text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { margin: 0 0 10px; font-size: clamp(1.3rem, 4vw, 1.7rem); font-weight: 800; letter-spacing: -.02em; }
  p { margin: 0 0 28px; color: var(--dim); line-height: 1.6; }
  .path { font-family: 'JetBrains Mono', monospace; color: var(--faint); word-break: break-all; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    text-decoration: none; font-weight: 600; font-size: .92rem;
    padding: 12px 20px; border-radius: 999px; transition: transform .2s ease, box-shadow .2s ease;
  }
  a.btn:hover { transform: translateY(-2px); }
  .primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 24px rgba(108,92,231,.28); }
  .ghost { color: var(--text); border: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
</style>
</head>
<body>
<main>
  <div style="position:relative;display:inline-block">
    <p class="code" aria-hidden="true">404</p>
    <span class="spray" style="width:6px;height:6px;left:-14px;top:18%"></span>
    <span class="spray" style="width:4px;height:4px;right:-10px;top:8%"></span>
    <span class="spray" style="width:5px;height:5px;right:6%;bottom:-6px"></span>
    <span class="spray" style="width:3px;height:3px;left:12%;bottom:-10px"></span>
  </div>
  <p class="tag">page not found</p>
  <h1>여긴 아무것도 없어요</h1>
  <p>주소가 바뀌었거나 사라진 페이지예요.<br><span class="path" id="path"></span></p>
  <div class="actions">
    <a class="btn primary" href="/">홈으로</a>
    <a class="btn ghost" href="/tools.html">업무 도구</a>
    <a class="btn ghost" href="https://github.com/homesweetlove" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</main>
<script>
  document.getElementById('path').textContent = location.pathname;
</script>
</body>
</html>
