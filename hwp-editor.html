<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-en="HWP editor | homesweetlove.dev">HWP 편집기 | homesweetlove.dev</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="homesweetlove.dev">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://homesweetlove.github.io/hwp-editor.html">
<meta property="og:title" content="HWP 편집기 | homesweetlove.dev" data-en-content="HWP editor | homesweetlove.dev">
<meta property="og:description" content="설치 없이 브라우저에서 HWP·HWPX 문서를 원본 모양 그대로 열고 편집해 저장합니다." data-en-content="Open, edit and save HWP/HWPX documents in your browser with their original layout — nothing to install.">
<meta property="og:image" content="https://avatars.githubusercontent.com/u/232012965?v=4&amp;s=400">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tools.css?v=11">
<script src="assets/i18n.js?v=1"></script>
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  body:before { display: none; }
  .tools-header { flex: none; }
  .editor-bar {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px;
    max-width: none; padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    backdrop-filter: blur(18px);
  }
  .editor-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .editor-badge {
    display: grid; place-items: center; flex: none;
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--coral)); color: #fff; font-weight: 700;
  }
  .editor-title strong { display: block; font-size: .95rem; line-height: 1.3; }
  .editor-title span { display: block; color: var(--muted); font: 500 .72rem 'IBM Plex Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  .editor-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .editor-actions .primary-button, .editor-actions .secondary-button { padding: 8px 13px; }
  .editor-actions button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
  .editor-stage { position: relative; flex: 1 1 auto; min-height: 540px; background: var(--bg-deep); }
  #editor { position: absolute; inset: 0; }
  #editor iframe { display: block; }
  .editor-overlay {
    position: absolute; inset: 0; z-index: 2;
    display: grid; place-items: center; padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%), var(--bg);
  }
  .editor-overlay[hidden] { display: none; }
  .editor-overlay .card { max-width: 460px; }
  .editor-overlay h1 { margin: 14px 0 8px; font-size: 1.45rem; letter-spacing: -.03em; }
  .editor-overlay p { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  .editor-overlay .hwp-drop-icon { margin: 0 auto; }
  .spinner { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  :root[data-lang="en"] .editor-stage.is-dragging::after { content: "Drop to open"; }
  .editor-stage.is-dragging::after {
    content: "여기에 놓으면 열립니다"; position: absolute; inset: 12px; z-index: 3;
    display: grid; place-items: center; border: 3px dashed var(--accent); border-radius: 18px;
    background: color-mix(in srgb, var(--bg) 80%, transparent); color: var(--accent-strong); font-weight: 700;
  }
  .editor-status { margin: 0; min-height: 1.2em; color: var(--green); font-size: .78rem; }
  .editor-status.error { color: var(--coral); }
  .editor-foot { flex: none; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 8px 24px; border-top: 1px solid var(--line); color: var(--muted); font: 500 .7rem 'IBM Plex Mono', monospace; }
  .editor-foot a { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 2px; }
  @media (max-width: 720px) {
    .editor-bar { padding: 10px 14px; }
    .editor-title span { max-width: 70vw; }
    .header-inner { padding: 0 16px; }
    nav { gap: 16px; }
  }
</style>
</head>
<body>
<header class="tools-header">
  <div class="header-inner">
    <a class="brand" href="index.html">homesweetlove<span>.dev</span></a>
    <nav aria-label="주요 메뉴" data-en-aria-label="Main menu">
      <a href="index.html" data-en="Portfolio">포트폴리오</a>
      <a href="tools.html" data-en="Work tools">업무 도구</a>
      <a class="nav-current" href="hwp-editor.html" aria-current="page" data-en="HWP editor">HWP 편집기</a>
      <button class="theme-button lang-toggle" type="button">EN</button>
      <button class="theme-button" id="theme-toggle" type="button" aria-label="테마 전환" data-en-aria-label="Toggle theme">☼</button>
    </nav>
  </div>
</header>

<div class="editor-bar">
  <div class="editor-title">
    <div class="editor-badge" aria-hidden="true" data-en="한">한</div>
    <div><strong data-en="HWP editor">HWP 편집기</strong><span id="doc-name" data-en="Open a document to start editing">문서를 열어 편집하세요</span></div>
  </div>
  <div class="editor-actions">
    <button class="secondary-button" id="open-file" type="button" disabled data-en="Open file">파일 열기</button>
    <button class="primary-button" id="save-hwp" type="button" disabled data-en="Save as HWP">HWP로 저장</button>
    <button class="secondary-button" id="save-hwpx" type="button" disabled data-en="Save as HWPX">HWPX로 저장</button>
    <input id="file-input" type="file" accept=".hwp,.hwpx,.hml" hidden>
  </div>
  <p class="editor-status" id="status" role="status" aria-live="polite"></p>
</div>

<main class="editor-stage" id="stage">
  <div id="editor"></div>
  <div class="editor-overlay" id="overlay">
    <div class="card" id="overlay-loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1 data-en="Getting the editor ready">편집기를 준비하는 중</h1>
      <p data-en="The first time, downloading the editing engine can take a few seconds.&lt;br&gt;Your document never leaves this browser.">처음 한 번은 편집 엔진을 내려받느라 몇 초 걸릴 수 있어요.<br>문서는 서버로 전송되지 않고 이 브라우저 안에서만 처리됩니다.</p>
    </div>
    <div class="card" id="overlay-error" hidden>
      <div class="hwp-drop-icon" aria-hidden="true">!</div>
      <h1 data-en="Couldn&#x27;t load the editor">편집기를 불러오지 못했어요</h1>
      <p id="overlay-error-text" data-en="Check your internet connection and reload.">인터넷 연결을 확인한 뒤 새로고침해 주세요.</p>
      <div class="action-row" style="justify-content:center">
        <button class="primary-button" type="button" onclick="location.reload()" data-en="Try again">다시 시도</button>
        <a class="secondary-button" href="https://edwardkim.github.io/rhwp/" target="_blank" rel="noopener" data-en="Open the official rhwp editor ↗">rhwp 공식 편집기 열기 ↗</a>
      </div>
    </div>
  </div>
</main>

<footer class="editor-foot">
  <span data-en="Editing engine: &lt;a href=&quot;https://github.com/edwardkim/rhwp&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;rhwp&lt;/a&gt; (MIT) · the editor view is loaded from the official rhwp site">편집 엔진: <a href="https://github.com/edwardkim/rhwp" target="_blank" rel="noopener">rhwp</a> (MIT) · 편집 화면은 rhwp 공식 사이트에서 불러옵니다</span>
  <span data-en="Open file · drag &amp; drop · Ctrl+S to save">파일 열기 · 끌어다 놓기 · Ctrl+S 저장</span>
</footer>

<script>
  (function () {
    const root = document.documentElement;
    try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch {}
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch {}
    });
  })();
</script>
<script>i18n.apply()</script>
<script type="module" src="assets/hwp-editor.js?v=2"></script>
</body>
</html>
